<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300" role="img" aria-labelledby="title desc"><title id="title">HerVoice legal retrieval architecture</title><desc id="desc">Reviewed sources are chunked and embedded into Atlas. A question is embedded to retrieve passages, checked for jurisdiction and source validity, and combined with the question for an OpenAI answer with citations. Source summaries remain available if generation fails.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8195a1" stroke-width="1.5"/></marker></defs><rect width="1400" height="1300" fill="#f7fafb"/><text x="80" y="64" font-family="Arial, sans-serif" font-size="36" fill="#193c4d" font-weight="700">HerVoice / Legal search architecture</text><text x="80" y="102" font-family="Arial, sans-serif" font-size="21" fill="#536675" font-weight="400">From reviewed documents to a clear explanation with traceable sources.</text><text x="80" y="157" font-family="Arial, sans-serif" font-size="14" fill="#216b85" font-weight="700">01  PREPARE THE KNOWLEDGE BASE</text><rect x="80" y="180" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(102,202)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-files"><path d="M20 7h-3a2 2 0 0 1-2-2V2"></path><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"></path><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"></path></svg></g><text x="146" y="224" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Reviewed sources</text><text x="104" y="259" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Official PDFs or the maintained</text><text x="104" y="284" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">U.S. / Ohio source registry</text><rect x="520" y="180" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(542,202)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scissors"><circle cx="6" cy="6" r="3"></circle><path d="M8.12 8.12 12 12"></path><path d="M20 4 8.12 15.88"></path><circle cx="6" cy="18" r="3"></circle><path d="M14.8 14.8 20 20"></path></svg></g><text x="586" y="224" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Extract &amp; split</text><text x="544" y="259" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">pypdf · overlapping text chunks</text><text x="544" y="284" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Keep page and source metadata</text><rect x="960" y="180" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(982,202)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></g><text x="1026" y="224" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Document embeddings</text><text x="984" y="259" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">OpenAI text-embedding-3-small</text><text x="984" y="284" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">768-dimensional vectors</text><path d="M420 245 H510" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M860 245 H950" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="80" y="382" font-family="Arial, sans-serif" font-size="14" fill="#216b85" font-weight="700">02  RETRIEVE RELEVANT PASSAGES</text><rect x="80" y="410" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(102,432)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle-question"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></g><text x="146" y="454" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Your question</text><text x="104" y="489" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Question + selected jurisdiction</text><text x="104" y="514" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Optional state and follow-up context</text><rect x="520" y="410" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(542,432)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></g><text x="586" y="454" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Query embedding</text><text x="544" y="489" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">The same OpenAI embedding model</text><text x="544" y="514" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">as the indexed source chunks</text><rect x="960" y="410" width="340" height="130" rx="16" fill="white" stroke="#27916b" stroke-opacity=".35" stroke-width="2"/><g transform="translate(982,432)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#27916b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-database"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg></g><text x="1026" y="454" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">MongoDB Atlas</text><text x="984" y="489" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Vector Search · cosine similarity</text><text x="984" y="514" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Rank and filter relevant chunks</text><path d="M420 475 H510" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M860 475 H950" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1130 310 V400" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="625" font-family="Arial, sans-serif" font-size="14" fill="#216b85" font-weight="700">03  CHECK CONTEXT &amp; EXPLAIN</text><rect x="960" y="655" width="340" height="130" rx="16" fill="white" stroke="#27916b" stroke-opacity=".35" stroke-width="2"/><g transform="translate(982,677)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#27916b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></g><text x="1026" y="699" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Verify the sources</text><text x="984" y="734" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Jurisdiction, review expiry, version</text><text x="984" y="759" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Exclude stale or withdrawn text</text><rect x="520" y="655" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(542,677)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></g><text x="586" y="699" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Question + context</text><text x="544" y="734" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Original question + retrieved text</text><text x="544" y="759" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Keep coverage limits and citations</text><path d="M1130 540 V645" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M960 720 H870" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250 540 V720 H510" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="96" y="690" font-family="Arial, sans-serif" font-size="17" fill="#536675" font-weight="400">Original question</text><rect x="520" y="875" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(542,897)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg></g><text x="586" y="919" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">OpenAI explanation</text><text x="544" y="954" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Generate from retrieved text only</text><text x="544" y="979" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">No unsupported laws or outcomes</text><rect x="960" y="875" width="340" height="130" rx="16" fill="white" stroke="#b27b36" stroke-opacity=".35" stroke-width="2"/><g transform="translate(982,897)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b27b36" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></g><text x="1026" y="919" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">If AI is unavailable</text><text x="984" y="954" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Show the retrieved summaries</text><text x="984" y="979" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">and a clear availability notice</text><path d="M690 785 V865" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M860 940 H950" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="1090" width="340" height="130" rx="16" fill="white" stroke="#216b85" stroke-opacity=".35" stroke-width="2"/><g transform="translate(542,1112)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#216b85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg></g><text x="586" y="1134" font-family="Arial, sans-serif" font-size="22" fill="#193c4d" font-weight="700">Answer + sources</text><text x="544" y="1169" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">Readable response and official links</text><text x="544" y="1194" font-family="Arial, sans-serif" font-size="18" fill="#536675" font-weight="400">No relevant evidence? Say so.</text><path d="M690 1005 V1080" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1130 1005 V1155 H870" fill="none" stroke="#8195a1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="80" y="1265" font-family="Arial, sans-serif" font-size="17" fill="#536675" font-weight="400">Atlas path shown · Requires live configuration. Default local retrieval uses the reviewed registry and local ranking.</text></svg>