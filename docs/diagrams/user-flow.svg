<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="780" viewBox="0 0 1560 780" role="img" aria-labelledby="title desc"><title id="title">HerVoice: USER FLOW</title><desc id="desc">Enter brief details → Generate and review text → Choose an image cover → Encrypt and encode PNG → Verify the exported image → Share or send to demo feed. HerVoice · Local demo uses synthetic data. A prepared PNG is not a delivered request.</desc><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif} .heading{font-size:38px;font-weight:700;fill:#354652;letter-spacing:2px}.label{font-size:28px;fill:#364650}.detail{font-size:17px;fill:#536674}</style><text x="780" y="63" text-anchor="middle" class="heading">USER FLOW</text><text x="780" y="103" text-anchor="middle" font-size="21" fill="#657580">From a few words to a verified, discreet request</text><path d="M38 400 H1522 m-14 -13 14 13 -14 13" fill="none" stroke="#53616a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 400 V290" stroke="#3976d6" stroke-width="3"/><circle cx="140" cy="290" r="58" fill="white"/><circle cx="140" cy="290" r="58" fill="#3976d6" fill-opacity=".08" stroke="#3976d6" stroke-width="3"/><circle cx="140" cy="400" r="6" fill="white" stroke="#3976d6" stroke-width="3"/><g transform="translate(110.5 260.5)"><svg xmlns="http://www.w3.org/2000/svg" width="59" height="59" viewBox="0 0 24 24" fill="none" stroke="#3976d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-notebook-pen"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"></path><path d="M2 6h4"></path><path d="M2 10h4"></path><path d="M2 14h4"></path><path d="M2 18h4"></path><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"></path></svg></g><text x="140" y="145" text-anchor="middle" class="label">Enter brief</text><text x="140" y="178" te