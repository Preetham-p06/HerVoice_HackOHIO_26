label">image cover</text><text x="652" y="215" text-anchor="middle" class="detail">Generate, upload or select</text><path d="M908 400 V510" stroke="#9aab20" stroke-width="3"/><circle cx="908" cy="510" r="58" fill="white"/><circle cx="908" cy="510" r="58" fill="#9aab20" fill-opacity=".08" stroke="#9aab20" stroke-width="3"/><circle cx="908" cy="400" r="6" fill="white" stroke="#9aab20" stroke-width="3"/><g transform="translate(878.5 480.5)"><svg xmlns="http://www.w3.org/2000/svg" width="59" height="59" viewBox="0 0 24 24" fill="none" stroke="#9aab20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-keyhole"><circle cx="12" cy="16" r="1"></circle><rect x="3" y="10" width="18" height="12" rx="2"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg></g><text x="908" y="602" text-anchor="middle" class="label">Encrypt and</text><text x="908" y="635" text-anchor="middle" class="label">encode PNG</text><text x="908" y="672" text-anchor="middle" class="detail">Approved message only</text><path d="M1164 400 V290" stroke="#dd8638" stroke-width="3"/><circle cx="1164" cy="290" r="58" fill="white"/><circle cx="1164" cy="290" r="58" fill="#dd8638" fill-opacity=".08" stroke="#dd8638" stroke-width="3"/><circle cx="1164" cy="400" r="6" fill="white" stroke="#dd8638" stroke-width="3"/><g transform="translate(1134.5 260.5)"><svg xmlns="http://www.w3.org/2000/svg" width="59" height="59" viewBox="0 0 24 24" fill="none" stroke="#dd8638" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-badge-check"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg></g><text x="1164" y="145" text-anchor="middle" class="label">Verify the</text><text x="1164" y="178" text-anchor="middle" class="label">exported image</text><text x="1164" y="215" text-anchor="middle" clas