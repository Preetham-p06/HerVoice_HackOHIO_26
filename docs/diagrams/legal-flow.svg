<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="780" viewBox="0 0 1920 780" role="img" aria-labelledby="title desc"><title id="title">HerVoice: LEGAL SEARCH &amp; RESPONSE</title><desc id="desc">Review and chunk documents → Embed and index chunks → Receive a legal question → Embed the question → Search relevant document chunks → Check source versions → Generate a grounded answer → Present answer with citations. Atlas path shown; live setup is required. The local demo uses a reviewed registry. Coverage is U.S. / selected Ohio resources.</desc><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif} .heading{font-size:38px;font-weight:700;fill:#354652;letter-spacing:2px}.label{font-size:28px;fill:#364650}.detail{font-size:17px;fill:#536674}</style><text x="960" y="63" text-anchor="middle" class="heading">LEGAL SEARCH &amp; RESPONSE</text><text x="960" y="103" text-anchor="middle" font-size="21" fill="#657580">Reviewed U.S. sources → relevant passages → a cited explanation</text><path d="M38 400 H1882 m-14 -13 14 13 -14 13" fill="none" stroke="#53616a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 400 V290" stroke="#3976d6" stroke-width="3"/><circle cx="140" cy="290" r="58" fill="white"/><circle cx="140" cy="290" r="58" fill="#3976d6" fill-opacity=".08" stroke="#3976d6" stroke-width="3"/><circle cx="140" cy="400" r="6" fill="white" stroke="#3976d6" stroke-width="3"/><g transform="translate(110.5 260.5)"><svg xmlns="http://www.w3.org/2000/svg" width="59" height="59" viewBox="0 0 24 24" fill="none" stroke="#3976d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-files"><path d="M20 7h-3a2 2 0 0 1-2-2V2"></path><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"></path><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"></path></svg></g><text x="140" y="145" text-anchor="middle" class="label">Review and</text><text x="140" y="178" te