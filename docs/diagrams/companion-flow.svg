<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="780" viewBox="0 0 1560 780" role="img" aria-labelledby="title desc"><title id="title">HerVoice: MAYA · AI COMPANION</title><desc id="desc">Load the rigged avatar → Type or speak a message → Generate a supportive reply → Create optional female speech → Animate face and mouth → Choose your experience. Voice and memory are opt-in. Default mouth motion is audio-reactive; timed visemes require optional Rhubarb.</desc><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif} .heading{font-size:38px;font-weight:700;fill:#354652;letter-spacing:2px}.label{font-size:28px;fill:#364650}.detail{font-size:17px;fill:#536674}</style><text x="780" y="63" text-anchor="middle" class="heading">MAYA · AI COMPANION</text><text x="780" y="103" text-anchor="middle" font-size="21" fill="#657580">A moving character, a conversation, and controls that stay with you</text><path d="M38 400 H1522 m-14 -13 14 13 -14 13" fill="none" stroke="#53616a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 400 V290" stroke="#3976d6" stroke-width="3"/><circle cx="140" cy="290" r="58" fill="white"/><circle cx="140" cy="290" r="58" fill="#3976d6" fill-opacity=".08" stroke="#3976d6" stroke-width="3"/><circle cx="140" cy="400" r="6" fill="white" stroke="#3976d6" stroke-width="3"/><g transform="translate(110.5 260.5)"><svg xmlns="http://www.w3.org/2000/svg" width="59" height="59" viewBox="0 0 24 24" fill="none" stroke="#3976d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-person-standing"><circle cx="12" cy="5" r="1"></circle><path d="m9 20 3-6 3 6"></path><path d="m6 8 6 2 6-2"></path><path d="M12 10v4"></path></svg></g><text x="140" y="145" text-anchor="middle" class="label">Load the</text><text x="140" y="178" text-anchor="middle" class="label">rigged avatar</text><text x="140" y="215" text-anchor="middle" class="detail">Local GLB · useGL