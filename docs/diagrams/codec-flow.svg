<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="670" viewBox="0 0 1320 670" role="img" aria-labelledby="title desc"><title id="title">How HerVoice hides a message</title><desc id="desc">Approve, encrypt, pack an HV01 frame, check capacity, embed one bit per PNG pixel, and verify. The frame contains HV01, length, SHA-256, nonce, ciphertext and an authentication tag.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#777"/></marker></defs><rect width="1320" height="670" fill="white"/><text x="40" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">How HerVoice hides a message</text><rect x="40" y="100" width="380" height="115" rx="16" fill="white" stroke="#d5d5d5"/><circle cx="70" cy="134" r="16" fill="#f2f2f2"/><text x="65" y="140" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">1</text><text x="98" y="142" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Approve</text><text x="64" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#555">Choose the final message.</text><rect x="470" y="100" width="380" height="115" rx="16" fill="white" stroke="#d5d5d5"/><circle cx="500" cy="134" r="16" fill="#f2f2f2"/><text x="495" y="140" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">2</text><text x="528" y="142" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Encrypt</text><text x="494" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#555">Protect the message with AES-GCM.</text><rect x="900" y="100" width="380" height="115" rx="16" fill="white" stroke="#d5d5d5"/><circle cx="930" cy="134" r="16" fill="#f2f2f2"/><text x="925" y="140" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">3</text><text x="958" y="142" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Pack</text><text x="924" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#555">Add the HV01 header and checks.</text><path d="M420 157 H458" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 157 H888" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/><path d="M1090 215 V252" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="270" width="136" height="58" rx="8" fill="#f3f3f3"/><text x="58" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">HV01</text><rect x="180" y="270" width="166" height="58" rx="8" fill="#f3f3f3"/><text x="198" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Length</text><rect x="350" y="270" width="216" height="58" rx="8" fill="#f3f3f3"/><text x="368" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">SHA-256</text><rect x="570" y="270" width="166" height="58" rx="8" fill="#f3f3f3"/><text x="588" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Nonce</text><rect x="740" y="270" width="296" height="58" rx="8" fill="#f3f3f3"/><text x="758" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Ciphertext</text><rect x="1040" y="270" width="236" height="58" rx="8" fill="#f3f3f3"/><text x="1058" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Auth tag</text><path d="M230 328 V368" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="385" width="380" height="115" rx="16" fill="white" stroke="#d5d5d5"/><circle cx="70" cy="419" r="16" fill="#f2f2f2"/><text x="65" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">4</text><text x="98" y="427" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Check capacity</text><text x="64" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#555">Make sure the message fits.</text><rect x="470" y="385" width="380" height="115" rx="16" fill="white" stroke="#d5d5d5"/><circle cx="500" cy="419" r="16" fill="#f2f2f2"/><text x="495" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">5</text><text x="528" y="427" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Embed</text><text x="494" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#555">Hide one bit in each PNG pixel.</text><rect x="900" y="385" width="380" height="115" rx="16" fill="white" stroke="#d5d5d5"/><circle cx="930" cy="419" r="16" fill="#f2f2f2"/><text x="925" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">6</text><text x="958" y="427" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Verify</text><text x="924" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#555">Recover and check the message.</text><path d="M420 442 H458" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 442 H888" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="540" width="1240" height="90" rx="14" fill="#fafafa"/><text x="64" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#666">ONE PIXEL</text><text x="64" y="605" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#555">Only the last red-channel bit changes.</text><text x="445" y="596" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">10110110 → 1011011<tspan fill="#1769aa">1</tspan></text><text x="905" y="576" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#222">Accept valid data.</text><text x="905" y="605" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#555">Reject damaged or unauthorized data.</text></svg>