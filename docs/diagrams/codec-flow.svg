<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc"><title id="title">HerVoice: how a message becomes a verified PNG</title><desc id="desc">Encrypt approved UTF-8 bytes with AES-GCM. Pack HV01, body length, SHA-256 digest, nonce, ciphertext and authentication tag. Check capacity and embed one bit per pixel in the red channel. Decode and authenticate the exported PNG before returning it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#666666"/></marker></defs><rect width="1400" height="1140" fill="#ffffff"/><rect x="60" y="42" width="90" height="6" fill="#666666"/><text x="60" y="105" font-family="Arial, sans-serif" font-size="43" fill="#171717" font-weight="700">A message inside an image</text><text x="60" y="144" font-family="Arial, sans-serif" font-size="22" fill="#555555" font-weight="400">HerVoice PNG codec · Encrypt → frame → embed → verify</text><rect x="60" y="190" width="390" height="150" rx="18" fill="white" stroke="#d0d0d0"/><circle cx="93" cy="225" r="17" fill="#f3f3f3"/><text x="83" y="231" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">1</text><text x="123" y="232" font-family="Arial, sans-serif" font-size="23" fill="#171717" font-weight="700">Approve the message</text><text x="84" y="270" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Preserve the original UTF-8 bytes.</text><text x="84" y="297" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">The user controls the final text.</text><rect x="505" y="190" width="390" height="150" rx="18" fill="white" stroke="#d0d0d0"/><circle cx="538" cy="225" r="17" fill="#f3f3f3"/><text x="528" y="231" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">2</text><text x="568" y="232" font-family="Arial, sans-serif" font-size="23" fill="#171717" font-weight="700">Encrypt with AES-GCM</text><text x="529" y="270" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Key + fresh 12-byte nonce</text><text x="529" y="297" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Recipient organization is authenticated.</text><rect x="950" y="190" width="390" height="150" rx="18" fill="white" stroke="#d0d0d0"/><circle cx="983" cy="225" r="17" fill="#f3f3f3"/><text x="973" y="231" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">3</text><text x="1013" y="232" font-family="Arial, sans-serif" font-size="23" fill="#171717" font-weight="700">Pack the HV01 frame</text><text x="974" y="270" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Add the header and encrypted body.</text><text x="974" y="297" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Exact byte layout shown below.</text><path d="M450 265 H493" fill="none" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><path d="M895 265 H938" fill="none" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><path d="M1145 340 V383" fill="none" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="400" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="700">THE FRAME</text><rect x="60" y="424" width="136" height="91" rx="10" fill="#f3f3f3"/><text x="75" y="459" font-family="Arial, sans-serif" font-size="21" fill="#171717" font-weight="700">HV01</text><text x="75" y="488" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="400">4 bytes</text><rect x="200" y="424" width="206" height="91" rx="10" fill="#f3f3f3"/><text x="215" y="459" font-family="Arial, sans-serif" font-size="21" fill="#171717" font-weight="700">Body length</text><text x="215" y="488" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="400">4 bytes · big-endian</text><rect x="410" y="424" width="216" height="91" rx="10" fill="#f3f3f3"/><text x="425" y="459" font-family="Arial, sans-serif" font-size="21" fill="#171717" font-weight="700">SHA-256</text><text x="425" y="488" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="400">32 bytes</text><rect x="630" y="424" width="166" height="91" rx="10" fill="#fafafa"/><text x="645" y="459" font-family="Arial, sans-serif" font-size="21" fill="#171717" font-weight="700">Nonce</text><text x="645" y="488" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="400">12 bytes</text><rect x="800" y="424" width="286" height="91" rx="10" fill="#fafafa"/><text x="815" y="459" font-family="Arial, sans-serif" font-size="21" fill="#171717" font-weight="700">Ciphertext</text><text x="815" y="488" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="400">Message-length bytes</text><rect x="1090" y="424" width="246" height="91" rx="10" fill="#fafafa"/><text x="1105" y="459" font-family="Arial, sans-serif" font-size="21" fill="#171717" font-weight="700">Auth tag</text><text x="1105" y="488" font-family="Arial, sans-serif" font-size="15" fill="#555555" font-weight="400">16 bytes</text><text x="60" y="549" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">HEADER · 40 bytes</text><text x="630" y="549" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">BODY · nonce + ciphertext + authentication tag</text><text x="60" y="582" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">The length and SHA-256 digest describe the entire body. Boxes are not drawn to byte scale.</text><rect x="60" y="625" width="390" height="150" rx="18" fill="white" stroke="#d0d0d0"/><circle cx="93" cy="660" r="17" fill="#f3f3f3"/><text x="83" y="666" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">4</text><text x="123" y="667" font-family="Arial, sans-serif" font-size="23" fill="#171717" font-weight="700">Check image capacity</text><text x="84" y="705" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">One frame bit fits in each pixel.</text><text x="84" y="732" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Reject the message if it will not fit.</text><rect x="505" y="625" width="390" height="150" rx="18" fill="white" stroke="#d0d0d0"/><circle cx="538" cy="660" r="17" fill="#f3f3f3"/><text x="528" y="666" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">5</text><text x="568" y="667" font-family="Arial, sans-serif" font-size="23" fill="#171717" font-weight="700">Embed in PNG pixels</text><text x="529" y="705" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Replace the red channel’s last bit.</text><text x="529" y="732" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Keep green, blue, and alpha unchanged.</text><rect x="950" y="625" width="390" height="150" rx="18" fill="white" stroke="#d0d0d0"/><circle cx="983" cy="660" r="17" fill="#f3f3f3"/><text x="973" y="666" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="700">6</text><text x="1013" y="667" font-family="Arial, sans-serif" font-size="23" fill="#171717" font-weight="700">Verify the saved PNG</text><text x="974" y="705" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Read the frame and check its digest.</text><text x="974" y="732" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Authenticate, decrypt, compare bytes.</text><path d="M450 700 H493" fill="none" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><path d="M895 700 H938" fill="none" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="809" width="835" height="190" rx="18" fill="white" stroke="#d0d0d0"/><text x="84" y="845" font-family="Arial, sans-serif" font-size="16" fill="#555555" font-weight="700">ONE PIXEL, ONE HIDDEN BIT</text><text x="84" y="886" font-family="Arial, sans-serif" font-size="20" fill="#171717" font-weight="400">Red value before</text><text x="330" y="886" font-family="Arial, sans-serif" font-size="29" fill="#171717" font-weight="700">10110110</text><text x="84" y="931" font-family="Arial, sans-serif" font-size="20" fill="#171717" font-weight="400">Message bit = 1</text><text x="330" y="931" font-family="Arial, sans-serif" font-size="29" fill="#171717" font-weight="700">1011011</text><text x="443" y="931" font-family="Arial, sans-serif" font-size="29" fill="#1769aa" font-weight="700">1</text><text x="535" y="887" font-family="Arial, sans-serif" font-size="28" fill="#171717" font-weight="700">182 → 183</text><text x="535" y="923" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Only the final bit changes.</text><text x="84" y="973" font-family="Arial, sans-serif" font-size="18" fill="#555555" font-weight="400">Capacity check: frame bytes × 8 ≤ image width × image height</text><rect x="950" y="809" width="390" height="190" rx="18" fill="#f3f3f3"/><text x="974" y="849" font-family="Arial, sans-serif" font-size="25" fill="#171717" font-weight="700">Verified or rejected</text><text x="974" y="885" font-family="Arial, sans-serif" font-size="18" fill="#171717" font-weight="400">Valid PNG → recover exact message</text><text x="974" y="920" font-family="Arial, sans-serif" font-size="18" fill="#171717" font-weight="400">Bad digest → reject damaged data</text><text x="974" y="955" font-family="Arial, sans-serif" font-size="18" fill="#171717" font-weight="400">Wrong key / organization → reject</text><text x="60" y="1045" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="400">SHA-256 checks corruption; AES-GCM authenticates the encrypted message and recipient context.</text><text x="60" y="1080" font-family="Arial, sans-serif" font-size="19" fill="#555555" font-weight="400">Original PNG required: cropping, JPEG conversion, or recompression can destroy the payload.</text><text x="60" y="1110" font-family="Arial, sans-serif" font-size="17" fill="#555555" font-weight="400">Encryption is server-readable. Steganography hides data; it does not guarantee that its presence is undetectable.</text></svg>