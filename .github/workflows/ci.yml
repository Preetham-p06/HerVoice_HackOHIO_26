name: HerVoice checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r services/api/requirements.lock
      - run: .venv/bin/ruff check services tests scripts --select F
      - run: npm run typecheck
      - run: npm test
      - run: npm run contracts
      - run: git diff --exit-code packages/api-client
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
